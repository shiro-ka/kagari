name: kagari Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: kagari-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      JAVA_TOOL_OPTIONS: -Djava.awt.headless=true
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: jetbrains
          java-version: 25
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Write signing config
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          ALIAS: ${{ secrets.ALIAS }}
        run: |
          for name in SIGNING_KEY KEY_STORE_PASSWORD KEY_PASSWORD ALIAS; do
            if [ -z "${!name}" ]; then
              echo "::error::secret $name is empty"
              exit 1
            fi
          done
          printf '%s' "$SIGNING_KEY" | base64 -d > "$RUNNER_TEMP/kagari.p12"
          {
            echo "storeFile=$RUNNER_TEMP/kagari.p12"
            echo "storePassword=$KEY_STORE_PASSWORD"
            echo "keyAlias=$ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > signing.properties

      - name: Set version
        run: |
          base=$(grep '^versionName=' fdroid.properties | cut -d= -f2)
          echo "BUILD_NUMBER=${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "BUILD_VERSION=${base}-kagari.${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Show signing certificate
        run: |
          apk=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          "$apksigner" verify --print-certs "$apk"
          mkdir -p "$RUNNER_TEMP/out"
          cp "$apk" "$RUNNER_TEMP/out/kagari-${BUILD_VERSION}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: kagari-apk
          path: ${{ runner.temp }}/out/*.apk
          if-no-files-found: error

      - name: Remove signing files
        if: always()
        run: rm -f signing.properties "$RUNNER_TEMP/kagari.p12"

  emulator:
    name: Launch on emulator
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Download APK
        uses: actions/download-artifact@v8
        with:
          name: kagari-apk
          path: apk

      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
          KAGARI_TEST_POST: ${{ contains(github.event.head_commit.message, '[test-post]') && '1' || '' }}
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash .github/kagari/emulator-check.sh apk emulator-out

      - name: Upload emulator results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kagari-emulator
          path: emulator-out
          if-no-files-found: warn

  release:
    name: Publish release
    needs: [apk, emulator]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Check app changes
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "app=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only HEAD~1 HEAD | grep -v '^\.github/' | grep -q .; then
            echo "app=true" >> "$GITHUB_OUTPUT"
          else
            echo "app=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download APK
        if: steps.changes.outputs.app == 'true'
        uses: actions/download-artifact@v8
        with:
          name: kagari-apk
          path: apk

      - name: Publish release
        if: steps.changes.outputs.app == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk=$(ls apk/*.apk | head -n 1)
          version=$(basename "$apk" .apk)
          version=${version#kagari-}
          subject=$(git log -1 --format=%s)
          gh release create "v$version" "$apk" --title "kagari $version" --notes "$subject" --target "$GITHUB_SHA"

      - name: Remove old releases
        if: steps.changes.outputs.app == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 100 --json tagName,createdAt --jq 'sort_by(.createdAt) | reverse | .[10:] | .[].tagName' |
            while read -r tag; do
              gh release delete "$tag" --yes --cleanup-tag
            done
