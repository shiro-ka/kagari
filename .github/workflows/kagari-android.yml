name: kagari Android

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev

permissions:
  contents: read

concurrency:
  group: kagari-android-${{ github.ref }}-${{ contains(github.event.head_commit.message, '[prerelease]') }}
  cancel-in-progress: true

jobs:
  check:
    name: Compile check
    if: ${{ !(github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[emulator]') || contains(github.event.head_commit.message, '[two-accounts]') || contains(github.event.head_commit.message, '[prerelease]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      JAVA_TOOL_OPTIONS: -Djava.awt.headless=true
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: jetbrains
          java-version: 25
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Compile
        run: ./gradlew :app:compileDebugKotlin :app:mergeDebugResources --stacktrace

  apk:
    name: Signed APK
    if: ${{ github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[emulator]') || contains(github.event.head_commit.message, '[two-accounts]') || contains(github.event.head_commit.message, '[prerelease]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      JAVA_TOOL_OPTIONS: -Djava.awt.headless=true
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: jetbrains
          java-version: 25
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Write signing config
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          ALIAS: ${{ secrets.ALIAS }}
        run: |
          for name in SIGNING_KEY KEY_STORE_PASSWORD KEY_PASSWORD ALIAS; do
            if [ -z "${!name}" ]; then
              echo "::error::secret $name is empty"
              exit 1
            fi
          done
          printf '%s' "$SIGNING_KEY" | base64 -d > "$RUNNER_TEMP/kagari.p12"
          {
            echo "storeFile=$RUNNER_TEMP/kagari.p12"
            echo "storePassword=$KEY_STORE_PASSWORD"
            echo "keyAlias=$ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > signing.properties

      - name: Set version
        run: |
          base=$(grep '^versionName=' fdroid.properties | cut -d= -f2)
          number=$(( ${{ github.run_number }} + 100 ))
          kind=${{ github.ref == 'refs/heads/main' && 'release' || 'prerelease' }}
          echo "BUILD_NUMBER=${number}" >> "$GITHUB_ENV"
          echo "BUILD_VERSION=$(python3 .github/kagari/next-version.py "$base" "$kind")" >> "$GITHUB_ENV"

      - name: Rename app in strings
        run: python3 .github/kagari/rename-strings.py

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Show signing certificate
        run: |
          apk=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          "$apksigner" verify --print-certs "$apk"
          mkdir -p "$RUNNER_TEMP/out"
          cp "$apk" "$RUNNER_TEMP/out/kagari-${BUILD_VERSION}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: kagari-apk
          path: ${{ runner.temp }}/out/*.apk
          if-no-files-found: error

      - name: Remove signing files
        if: always()
        run: rm -f signing.properties "$RUNNER_TEMP/kagari.p12"

  emulator:
    name: Launch on emulator
    needs: apk
    if: ${{ github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[emulator]') || contains(github.event.head_commit.message, '[two-accounts]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Download APK
        uses: actions/download-artifact@v8
        with:
          name: kagari-apk
          path: apk

      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          BSKY_HANDLE: ${{ secrets.BSKY_SUB_HANDLE || secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_SUB_APP_PASSWORD || secrets.BSKY_APP_PASSWORD }}
          BSKY_MAIN_HANDLE: ${{ secrets.BSKY_MAIN_HANDLE }}
          BSKY_MAIN_APP_PASSWORD: ${{ secrets.BSKY_MAIN_APP_PASSWORD }}
          KAGARI_TEST_POST: ${{ contains(github.event.head_commit.message, '[test-post]') && '1' || '' }}
          KAGARI_TWO_ACCOUNTS: ${{ contains(github.event.head_commit.message, '[two-accounts]') && '1' || '' }}
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash .github/kagari/emulator-check.sh apk emulator-out

      - name: Upload emulator results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kagari-emulator
          path: emulator-out
          if-no-files-found: warn

  release:
    name: Publish release
    needs: [apk, emulator]
    if: ${{ !cancelled() && needs.apk.result == 'success' && ((github.ref == 'refs/heads/main' && needs.emulator.result == 'success') || (github.ref == 'refs/heads/dev' && contains(github.event.head_commit.message, '[prerelease]'))) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check app changes
        id: changes
        run: |
          last=$(git tag --merged HEAD --sort=-creatordate | grep -E -- '-kagari\.([0-9]+|[0-9]+\.0)$' | head -n 1)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "app=true" >> "$GITHUB_OUTPUT"
          elif [ -z "$last" ]; then
            echo "app=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$last" HEAD | grep -v '^\.github/' | grep -q .; then
            echo "app=true" >> "$GITHUB_OUTPUT"
          else
            echo "app=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download APK
        if: steps.changes.outputs.app == 'true'
        uses: actions/download-artifact@v8
        with:
          name: kagari-apk
          path: apk

      - name: Publish release
        if: steps.changes.outputs.app == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk=$(ls apk/*.apk | head -n 1)
          version=$(basename "$apk" .apk)
          version=${version#kagari-}
          subject=$(git log -1 --format=%s)
          flags=()
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            flags+=(--prerelease)
          fi
          gh release create "v$version" "$apk" --title "kagari $version" --notes "$subject" --target "$GITHUB_SHA" "${flags[@]}"

      - name: Remove old releases
        if: steps.changes.outputs.app == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for pre in true false; do
            gh release list --limit 100 --json tagName,createdAt,isPrerelease --jq "[.[] | select(.isPrerelease == $pre)] | sort_by(.createdAt) | reverse | .[10:] | .[].tagName"
          done |
            while read -r tag; do
              gh release delete "$tag" --yes --cleanup-tag
            done
