<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>kagari</title>
<style>body{font-family:sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0}</style>
</head>
<body>
<p class="status">kagari</p>
<script>
(function () {
  var search = window.location.search;
  var hash = window.location.hash;
  var params = search && search.length > 1 ? search : (hash && hash.length > 1 ? '?' + hash.substring(1) : '');
  var target = 'kagari://Callback/SignIn/Bluesky' + params;
  var link = document.createElement('a');
  link.href = target;
  link.textContent = 'Open kagari';
  try {
    window.location.replace(target);
  } catch (_) {}
  var status = document.querySelector('.status');
  status.textContent = '';
  status.appendChild(link);
})();
</script>
</body>
</html>
